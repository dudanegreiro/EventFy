name: Secrets Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets-check:
    name: secrets-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout completo para verificacao
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bloquear arquivos sensiveis versionados (.env, chaves privadas)
        run: |
          FOUND=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|jks|secret|credentials)$' | grep -vx '\.env\.example' || true)
          if [ -n "$FOUND" ]; then
            echo "Erro: arquivo sensivel versionado detectado:"
            echo "$FOUND"
            exit 1
          fi

      - name: Verificar que .gitignore protege .env e .env.example nao expoe segredos reais
        run: |
          grep -qx '\.env' .gitignore
          if grep -E '^CHAVE_SECRETA_JWT=.{16,}$' .env.example | grep -vqE '(SUBSTITUA|GERAR_|ALTERE|EXEMPLO|troque)'; then
            echo "Erro: .env.example parece conter um valor real em CHAVE_SECRETA_JWT."
            exit 1
          fi

      - name: Varrer repositorio por padroes comuns de segredos vazados
        run: |
          PATTERN='(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35})'
          if git grep -n -I -E "$PATTERN" -- ':!.github/workflows/secrets-check.yml' ':!docs/SEGURANCA-SEGREDOS.md'; then
            echo "Erro: padrao de segredo detectado no codigo versionado."
            exit 1
          fi
