<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFy — Solicitação enviada</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="brand">Event<span>Fy</span></div><a href="catalogo.html">Catálogo</a></header>
<main class="container narrow">
  <section class="request-summary" id="request-summary" hidden>
    <div class="status-icon">✓</div>
    <p class="eyebrow">SOLICITAÇÃO ENVIADA</p>
    <h1>Pedido registrado</h1>
    <p>A solicitação está aguardando a análise do prestador.</p>
    <p><span class="status-pill" id="summary-status">SOLICITADA</span></p>
    <dl class="request-details">
      <div><dt>Serviço</dt><dd id="summary-service"></dd></div>
      <div><dt>Evento</dt><dd id="summary-event"></dd></div>
      <div><dt>Início</dt><dd id="summary-start"></dd></div>
      <div><dt>Fim</dt><dd id="summary-end"></dd></div>
      <div><dt>Observação</dt><dd id="summary-observation"></dd></div>
    </dl>
    <nav class="flow-actions">
      <a class="text-link" id="history-link" href="historico.html">Ver histórico</a>
    </nav>
    <a class="text-link" href="catalogo.html">Voltar ao catálogo</a>
  </section>
  <p class="muted" id="summary-loading" role="status">Carregando a solicitação...</p>
  <section id="invalid-request" role="alert" hidden>
    <h1>Não foi possível exibir a solicitação</h1>
    <p id="request-error-message"></p>
    <a class="button" href="catalogo.html">Voltar ao catálogo</a>
  </section>
</main>
<script src="js/api.js"></script>
<script src="js/sessao.js"></script>
<script src="js/solicitacao.js"></script>
</body>
</html>
