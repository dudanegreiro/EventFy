<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFy — Confirmada</title><link rel="stylesheet" href="css/style.css">
</head>
<body data-expected-status="CONFIRMADA">
<header><div class="brand">Event<span>Fy</span></div><a href="catalogo.html">Catálogo</a></header>
<main class="container narrow">
  <p class="muted" id="state-loading" role="status">Carregando a reserva...</p>
  <section class="request-summary" id="state-view" hidden>
    <div class="status-icon">✓</div>
    <p class="eyebrow">RESERVA CONFIRMADA</p>
    <h1>Tudo certo!</h1>
    <p id="state-text">A reserva foi confirmada e a agenda do serviço está bloqueada para este período.</p>
    <p><span class="status-pill" id="summary-status"></span></p>
    <dl class="request-details">
      <div><dt>Serviço</dt><dd id="summary-service"></dd></div>
      <div><dt>Evento</dt><dd id="summary-event"></dd></div>
      <div><dt>Início</dt><dd id="summary-start"></dd></div>
      <div><dt>Fim</dt><dd id="summary-end"></dd></div>
      <div><dt>Observação</dt><dd id="summary-observation"></dd></div>
    </dl>
    <p class="form-error" id="flow-error" role="alert" hidden></p>
    <nav class="flow-actions">
      <a class="text-link" id="history-link" href="historico.html">Ver histórico</a>
      <a class="text-link" href="reservas.html">Voltar às reservas</a>
    </nav>
  </section>
  <section id="state-error" role="alert" hidden>
    <h1>Não foi possível exibir esta reserva</h1>
    <p id="state-error-message"></p>
    <a class="button" href="reservas.html">Voltar às reservas</a>
  </section>
</main>
<script src="js/api.js"></script>
<script src="js/sessao.js"></script>
<script src="js/reservas.js"></script>
</body>
</html>
