<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFy — Solicitação</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="brand">Event<span>Fy</span></div><a id="service-back" href="catalogo.html">← Serviço</a></header>
<main class="container narrow">
  <p class="eyebrow">NOVA SOLICITAÇÃO</p>
  <h1>Solicitar reserva</h1>
  <p id="selected-service" class="selected-service"></p>
  <p id="request-error" class="form-error" role="alert" hidden>Selecione um serviço válido no catálogo antes de continuar.</p>
  <form id="request-form" hidden>
    <label for="event">Evento existente</label>
    <select id="event" name="event" required>
      <option value="">Selecione um evento</option>
      <option value="aniversario">Festa de aniversário</option>
      <option value="casamento">Casamento</option>
      <option value="confraternizacao">Confraternização</option>
    </select>
    <label for="starts-at">Início do período</label>
    <input id="starts-at" name="starts-at" type="datetime-local" required>
    <label for="ends-at">Fim do período</label>
    <input id="ends-at" name="ends-at" type="datetime-local" required>
    <label for="observation">Observação <span class="muted">(opcional)</span></label>
    <textarea id="observation" name="observation" placeholder="Conte algum detalhe importante"></textarea>
    <button class="button" type="submit">Enviar solicitação</button>
  </form>
  <p class="muted">O protótipo valida o período e demonstra o estado inicial da solicitação; não salva dados em um servidor.</p>
</main>
<script src="js/script.js"></script>
</body>
</html>
