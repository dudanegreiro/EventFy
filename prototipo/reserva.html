<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFy — Solicitação</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="brand">Event<span>Fy</span></div><a id="service-back" href="catalogo.html">← Serviço</a></header>
<main class="container narrow">
  <p class="eyebrow">NOVA SOLICITAÇÃO</p>
  <h1>Solicitar reserva</h1>
  <p id="selected-service" class="selected-service"></p>
  <p id="availability-hint" class="muted"></p>
  <p id="request-error" class="form-error" role="alert" hidden></p>
  <form id="request-form" hidden>
    <label for="event">Evento</label>
    <select id="event" name="event" required>
      <option value="">Selecione um evento</option>
    </select>
    <div id="new-event-fields" class="new-event" role="group" aria-labelledby="new-event-title" hidden>
      <p id="new-event-title" class="eyebrow">NOVO EVENTO</p>
      <label for="new-event-name">Nome do evento</label>
      <input id="new-event-name" type="text" maxlength="160">
      <label for="new-event-location">Local</label>
      <input id="new-event-location" type="text" maxlength="200">
      <label for="new-event-start">Início do evento</label>
      <input id="new-event-start" type="datetime-local">
      <label for="new-event-end">Fim do evento</label>
      <input id="new-event-end" type="datetime-local">
      <label for="new-event-description">Descrição <span class="muted">(opcional)</span></label>
      <textarea id="new-event-description"></textarea>
    </div>
    <label for="starts-at">Início do período</label>
    <input id="starts-at" name="starts-at" type="datetime-local" required>
    <label for="ends-at">Fim do período</label>
    <input id="ends-at" name="ends-at" type="datetime-local" required>
    <label for="observation">Observação <span class="muted">(opcional)</span></label>
    <textarea id="observation" name="observation" placeholder="Conte algum detalhe importante"></textarea>
    <button id="request-submit" class="button" type="submit">Enviar solicitação</button>
  </form>
</main>
<script src="js/api.js"></script>
<script src="js/sessao.js"></script>
<script src="js/solicitacao.js"></script>
</body>
</html>
