<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFy — Solicitação</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="brand">Event<span>Fy</span></div><a href="servico.html">← Serviço</a></header>
<main class="container narrow">
  <p class="eyebrow">NOVA SOLICITAÇÃO</p><h1>Solicitar reserva</h1>
  <form onsubmit="return enviarSolicitacao()">
    <label>Evento<input required value="Festa de aniversário"></label>
    <label>Data do evento<input required type="date" value="2026-10-10"></label>
    <label>Observação<textarea placeholder="Conte algum detalhe importante"></textarea></label>
    <button class="button" type="submit">Enviar solicitação</button>
  </form>
  <p class="muted">No protótipo, o envio leva à tela de análise da solicitação.</p>
</main>
<script src="js/script.js"></script>
</body>
</html>
