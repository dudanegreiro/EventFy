<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFy — Catálogo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="brand">Event<span>Fy</span></div><a href="index.html">Início</a></header>
  <main class="container">
    <div class="section-title">
      <div><p class="eyebrow">CATÁLOGO</p><h1>Serviços para seu evento</h1></div>
    </div>
    <div class="filters">
      <label class="visually-hidden" for="search">Buscar serviço</label>
      <input id="search" type="search" placeholder="Buscar serviço..." aria-label="Buscar serviço">
      <label class="visually-hidden" for="category">Filtrar por categoria</label>
      <select id="category">
        <option value="">Todas as categorias</option>
      </select>
      <label class="visually-hidden" for="price-min">Preço mínimo</label>
      <input id="price-min" type="number" min="0" step="0.01" placeholder="Preço mínimo">
      <label class="visually-hidden" for="price-max">Preço máximo</label>
      <input id="price-max" type="number" min="0" step="0.01" placeholder="Preço máximo">
      <label class="visually-hidden" for="location">Localização</label>
      <input id="location" type="search" placeholder="Cidade ou região">
      <label class="visually-hidden" for="date-start">Disponível a partir de</label>
      <input id="date-start" type="date" aria-label="Disponível a partir de">
      <label class="visually-hidden" for="date-end">Disponível até</label>
      <input id="date-end" type="date" aria-label="Disponível até">
    </div>
    <p class="form-error" id="filter-error" role="alert" hidden></p>
    <p class="form-error" id="catalog-error" role="alert" hidden></p>
    <p class="muted" id="catalog-status" role="status" aria-live="polite">Carregando serviços...</p>
    <div class="grid" id="cards" aria-live="polite"></div>
    <p class="empty-state" id="empty-state" role="status" aria-live="polite" hidden>
      Nenhum serviço encontrado. Tente ajustar os filtros.
    </p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
