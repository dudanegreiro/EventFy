<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFy — Entrar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><div class="brand">Event<span>Fy</span></div><a href="index.html">Início</a></header>
  <main class="container narrow">
    <p class="eyebrow">ACESSO</p>
    <h1>Entrar</h1>
    <p class="muted">Use uma conta de organizador ou de prestador para solicitar e acompanhar reservas.</p>
    <p id="login-error" class="form-error" role="alert" hidden></p>
    <form id="login-form">
      <label for="login-email">E-mail</label>
      <input id="login-email" name="email" type="email" autocomplete="username" required>
      <label for="login-password">Senha</label>
      <input id="login-password" name="senha" type="password" autocomplete="current-password" required>
      <button id="login-submit" class="button" type="submit">Entrar</button>
    </form>
    <p class="muted">
      Contas de demonstração do ambiente local: <strong>organizador.demo@eventfy.local</strong> e
      <strong>prestador.demo@eventfy.local</strong>. A senha de demonstração está em <code>docs/DATABASE.md</code>.
    </p>
  </main>
  <script src="js/api.js"></script>
  <script src="js/sessao.js"></script>
</body>
</html>
