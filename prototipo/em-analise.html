<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventFy — Análise da solicitação</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header><div class="brand">Event<span>Fy</span></div><a href="catalogo.html">Catálogo</a></header>
<main class="container narrow">
  <p class="muted" id="analysis-loading" role="status">Carregando a solicitação...</p>
  <section class="request-summary" id="analysis-view" hidden>
    <p class="eyebrow">ANÁLISE DA SOLICITAÇÃO</p>
    <h1>Solicitação de reserva</h1>
    <p id="status-text"></p>
    <p><span class="status-pill" id="summary-status"></span></p>
    <dl class="request-details">
      <div><dt>Serviço</dt><dd id="summary-service"></dd></div>
      <div><dt>Evento</dt><dd id="summary-event"></dd></div>
      <div><dt>Início</dt><dd id="summary-start"></dd></div>
      <div><dt>Fim</dt><dd id="summary-end"></dd></div>
      <div><dt>Observação</dt><dd id="summary-observation"></dd></div>
    </dl>
    <div class="reason" id="refusal-box" hidden><b>Motivo informado pelo fornecedor</b><p id="refusal-reason"></p></div>
    <button class="button" type="button" id="start-analysis" hidden>Iniciar análise</button>
    <form class="decision-form" id="provider-decision-form" hidden>
      <label for="refusal-reason-input">Justificativa da recusa <span class="muted">(mínimo de 10 caracteres)</span></label>
      <textarea id="refusal-reason-input" placeholder="Informe o motivo caso recuse"></textarea>
      <div class="decision-actions">
        <button class="button" type="submit" data-decision="APROVADA">Aprovar solicitação</button>
        <button class="button secondary" type="submit" data-decision="RECUSADA">Recusar solicitação</button>
      </div>
    </form>
    <p class="form-error" id="flow-error" role="alert" hidden></p>
    <p class="status-pill" id="decision-result" role="status" hidden></p>
    <nav class="flow-actions">
      <a class="text-link" id="history-link" href="historico.html">Ver histórico</a>
      <a class="text-link" id="back-link" href="reservas.html">Voltar às reservas</a>
    </nav>
  </section>
  <section id="analysis-error" role="alert" hidden>
    <h1>Não foi possível exibir esta solicitação</h1>
    <p id="analysis-error-message"></p>
    <a class="button" href="reservas.html">Voltar às reservas</a>
  </section>
</main>
<script src="js/api.js"></script>
<script src="js/sessao.js"></script>
<script src="js/reservas.js"></script>
</body>
</html>
